<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saurav's Missile Launcher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { display: block; touch-action: none; }
        #overlay {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #0f0;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #0f0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>System Active</h2>
        <p>Tap Screen to Launch Missile</p>
    </div>
    <canvas id="scene"></canvas>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');
        let width, height;

        function setSize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', setSize);
        setSize();

        const missiles = [];
        const particles = [];

        class Missile {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distance = Math.hypot(targetX - x, targetY - y);
                this.traveled = 0;
                this.angle = Math.atan2(targetY - y, targetX - x);
                this.speed = 3;
                this.accel = 1.06;
                this.hue = Math.random() * 360;
            }

            update(index) {
                this.speed *= this.accel;
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;
                this.traveled = Math.hypot(this.x - (this.targetX - Math.cos(this.angle) * this.distance), this.y - (this.targetY - Math.sin(this.angle) * this.distance));

                if (this.speed + this.traveled >= this.distance) {
                    explode(this.targetX, this.targetY, this.hue);
                    missiles.splice(index, 1);
                } else {
                    this.x += vx;
                    this.y += vy;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
                ctx.fill();
                // Trail effect
                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 8 + 2;
                this.friction = 0.95;
                this.gravity = 0.5;
                this.hue = hue + (Math.random() * 40 - 20);
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }

            update(index) {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
                if (this.alpha <= 0) particles.splice(index, 1);
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`;
                ctx.fill();
            }
        }

        function explode(x, y, hue) {
            // Mobile vibration if supported
            if (navigator.vibrate) navigator.vibrate(50);
            
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle(x, y, hue));
            }
        }

        function launch(e) {
            const tx = e.touches ? e.touches[0].clientX : e.clientX;
            const ty = e.touches ? e.touches[0].clientY : e.clientY;
            missiles.push(new Missile(width / 2, height, tx, ty));
        }

        canvas.addEventListener('mousedown', launch);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            launch(e);
        });

        function animate() {
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            missiles.forEach((m, i) => { m.draw(); m.update(i); });
            particles.forEach((p, i) => { p.draw(); p.update(i); });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
  </html>
